{% extends 'base.html' %}
{% block content %}
<h2>Entrar</h2>
<form method="POST">
    <div class="form-group">
        <label>E-mail</label>
        <input type="email" name="email" required>
    </div>
    <div class="form-group">
        <label>Palavra-passe</label>
        <input type="password" name="password" required>
    </div>
    <button type="submit" class="btn">Entrar</button>
</form>
{% endblock %}
